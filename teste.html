    .tp-section{width:100%;display:flex;flex-direction:column;align-items:center;padding:56px 24px;gap:28px;}

    .pdf-doc{width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;}
    .pdf-doc canvas{width:100%;display:block;}
    .pdf-frame{
      width:100%;max-width:900px;

    .pdf-frame-dark{border-color:rgba(255,255,255,.08);box-shadow:0 8px 40px rgba(0,0,0,.2);}

    .vid-wrap{width:100%;max-width:900px;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#1a252d;}
    .vid-wrap iframe{width:100%;height:100%;border:none;display:block;}
    .ll-vid-thumb{width:100%;height:100%;position:relative;cursor:pointer;background:#000;}
    .ll-vid-thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85;}
    .ll-vid-thumb .yt-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
    .ll-vid-thumb .yt-play svg{width:64px;height:64px;transition:transform .18s;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));}
    .ll-vid-thumb:hover .yt-play svg{transform:scale(1.1);}

    #footer{
      width:100%;background:#1A252D;padding:44px 24px 36px;
      display:flex;flex-direction:column;align-items:center;gap:14px;
    }
    #footer-copy{font-size:10px;color:rgba(255,255,255,.2);letter-spacing:1px;}
    #footer-test-badge{font-size:10px;color:rgba(255,255,255,.15);letter-spacing:.5px;}

    #error-screen{
      display:none;min-height:60vh;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:40px;
    }
    #error-screen p{font-size:15px;color:#7A8F96;text-align:center;}

<script>
const SB_URL = "https://wwnndsprpofmgbklqdgg.supabase.co";
const SB_KEY = "sb_publishable__RQxBa8P-lryd0LtWgTJPw_-aSWERWK";
const PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const YT_PLAY_SVG = `<svg viewBox="0 0 68 48" xmlns="http://www.w3.org/2000/svg">
  <rect width="68" height="48" rx="10" fill="rgba(0,0,0,.75)"/>
  <polygon points="27,14 27,34 47,24" fill="#fff"/>
</svg>`;

const HEADERS = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY };
const BG_CYCLE = ["#2E3C44", "#fff", "#F5F4F0"];

function showError(msg) {
  document.getElementById("main-content").style.display = "none";
  const err = document.getElementById("error-screen");
  err.style.display = "flex";
  document.getElementById("error-msg").textContent = msg;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function renderPdfNow(url, wrapper) {
  if (/\.(jpg|jpeg|png|webp|gif|avif)(\?|$)/i.test(url)) {
    const img = document.createElement("img");
    img.src = url;
    img.style.cssText = "width:100%;display:block;";
    img.loading = "lazy";
    wrapper.style.minHeight = "";
    wrapper.appendChild(img);
    return;
  }
  try {
    const pdf = await pdfjsLib.getDocument({ url, withCredentials: false }).promise;
    const containerWidth = Math.min(wrapper.parentElement?.clientWidth || 900, 900);
    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      const vp = page.getViewport({ scale: 1 });
      const dpr = Math.min(Math.max(window.devicePixelRatio || 1, 2), 3);
      const scale = (containerWidth / vp.width) * dpr;
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = "100%";
      wrapper.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    }
    wrapper.style.minHeight = "";
  } catch(e) {
    const p = document.createElement("p");
    p.style.cssText = "color:#e74c3c;font-size:13px;padding:16px;text-align:center";
    p.textContent = "Erro ao carregar PDF.";
    wrapper.appendChild(p);
  }
}

function renderPdf(url, frameEl, dark) {
  const wrapper = document.createElement("div");
  wrapper.className = "pdf-doc";
  wrapper.style.minHeight = "400px";
  frameEl.appendChild(wrapper);
  let rendered = false;
  const obs = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && !rendered) {
      rendered = true; obs.disconnect();
      renderPdfNow(url, wrapper);
    }
  }, { rootMargin: "200px" });
  obs.observe(wrapper);
}

function _ytId(url) {
  if (!url) return null;
  const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/))([\w-]{11})/);
  if (m) return m[1];
  const m2 = String(url).match(/[?&]v=([\w-]{11})/);
  return m2 ? m2[1] : null;
}

function renderCarrossel(fotos, container) {
  if (!fotos || !fotos.length) return;
  const urls = fotos.map(x => typeof x === "string" ? x : x.url).filter(Boolean);
  if (!urls.length) return;

  const wrap = document.createElement("div");
  wrap.style.cssText = "width:100%;max-width:900px;aspect-ratio:16/9;overflow:hidden;position:relative;background:#1a252d;border-radius:14px;";

  urls.forEach((u, i) => {
    const img = document.createElement("img");
    img.src = u; img.alt = ""; img.loading = "lazy";
    img.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:" + (i === 0 ? "1" : "0") + ";transition:opacity 1s;";
    wrap.appendChild(img);
  });

  let idx = 0;
  const dotsWrap = document.createElement("div");
  dotsWrap.style.cssText = "position:absolute;bottom:10px;left:0;right:0;display:flex;gap:6px;justify-content:center;z-index:2;";

  const updateSlide = (newIdx) => {
    wrap.querySelectorAll("img").forEach((img, i) => { img.style.opacity = i === newIdx ? "1" : "0"; });
    dotsWrap.querySelectorAll("div").forEach((d, i) => { d.style.background = i === newIdx ? "#fff" : "rgba(255,255,255,.45)"; });
    idx = newIdx;
  };

  let timer;
  urls.forEach((_, i) => {
    const dot = document.createElement("div");
    dot.style.cssText = "width:7px;height:7px;border-radius:50%;cursor:pointer;transition:background .3s;background:" + (i === 0 ? "#fff" : "rgba(255,255,255,.45)") + ";";
    dot.onclick = () => { clearInterval(timer); updateSlide(i); if (urls.length > 1) timer = setInterval(() => updateSlide((idx + 1) % urls.length), 4000); };
    dotsWrap.appendChild(dot);
  });

  if (urls.length > 1) {
    wrap.appendChild(dotsWrap);
    timer = setInterval(() => updateSlide((idx + 1) % urls.length), 4000);
  }

  container.appendChild(wrap);
}

function renderVideo(url, section) {
  const id = _ytId(url);
  if (!id) return;
  const wrap = document.createElement("div");
  wrap.className = "vid-wrap";
  const thumb = document.createElement("div");
  thumb.className = "ll-vid-thumb";
  thumb.style.height = "100%";
  thumb.innerHTML = `<img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="Vídeo" loading="lazy">
    <div class="yt-play">${YT_PLAY_SVG}</div>`;
  thumb.onclick = () => {
    wrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" title="Vídeo" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  };
  wrap.appendChild(thumb);
  section.appendChild(wrap);
}

async function init() {
  const slug = new URLSearchParams(location.search).get("id");
  if (!slug) { showError("Link inválido. Solicite o link correto."); return; }

  let cfgRows, pdfsRow, videosRow;
  try {
    const [r1, r2, r3] = await Promise.all([
      fetch(SB_URL + "/rest/v1/app_config?chave=in.(landing_teste_slug,landing_teste_num_partes,landing_teste_partes_config)&select=chave,valor", { headers: HEADERS }),
      fetch(SB_URL + "/rest/v1/app_config?chave=eq.landing_pdfs&select=valor", { headers: HEADERS }),
      fetch(SB_URL + "/rest/v1/app_config?chave=eq.videos_landing&select=valor", { headers: HEADERS })
    ]);
    cfgRows  = await r1.json();
    pdfsRow  = await r2.json();
    videosRow = await r3.json();
  } catch(_) {
    showError("Erro de conexão. Tente novamente."); return;
  }

  const cfg = {};
  (cfgRows || []).forEach(r => { cfg[r.chave] = r.valor; });

  if (!cfg.landing_teste_slug || cfg.landing_teste_slug !== slug) {
    showError("Link inválido ou expirado."); return;
  }

  const numPartes = parseInt(cfg.landing_teste_num_partes) || 3;
  const partesCfg = Array.isArray(cfg.landing_teste_partes_config) ? cfg.landing_teste_partes_config : [];
  const allPdfs   = Array.isArray(pdfsRow?.[0]?.valor)   ? pdfsRow[0].valor   : [];
  const allVideos = Array.isArray(videosRow?.[0]?.valor) ? videosRow[0].valor : [];

  // Group content by parte_teste
  const byParte = {};
  allPdfs.forEach(item => {
    const p = typeof item === "object" && item.parte_teste ? item.parte_teste : null;
    if (!p) return;
    if (!byParte[p]) byParte[p] = { pdfs: [], videos: [] };
    byParte[p].pdfs.push(typeof item === "string" ? item : item.url);
  });
  allVideos.forEach(item => {
    const p = typeof item === "object" && item.parte_teste ? item.parte_teste : null;
    if (!p) return;
    if (!byParte[p]) byParte[p] = { pdfs: [], videos: [] };
    byParte[p].videos.push(typeof item === "string" ? item : item.url);
  });

  const hasAny = Object.keys(byParte).length > 0;
  if (!hasAny) {
    showError("Nenhum conteúdo configurado para esta apresentação."); return;
  }

  // Carrega PDF.js ANTES de montar as seções — evita race condition
  // nos primeiros PDFs que estão no viewport imediatamente
  const hasPdfs = Object.values(byParte).some(p => p.pdfs.length > 0);
  if (hasPdfs) {
    try {
      await loadScript(PDFJS_URL);
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    } catch(_) {}
  }

  const main = document.getElementById("main-content");

  for (let p = 1; p <= numPartes; p++) {
    const data = byParte[p];
    if (!data || (!data.pdfs.length && !data.videos.length)) continue;

    const bg = BG_CYCLE[(p - 1) % BG_CYCLE.length];
    const isDark = bg === "#2E3C44";

    const section = document.createElement("div");
    section.className = "tp-section";
    section.style.background = bg;

    const pcfg = partesCfg[p - 1] || {};

    if (pcfg.titulo) {
      const tituloEl = document.createElement("div");
      tituloEl.style.cssText = "width:100%;max-width:900px;font-family:'DM Serif Display',serif;font-size:30px;font-weight:400;color:" + (isDark ? "#F5D68A" : "#E8A52A") + ";text-align:left;line-height:1.2;";
      tituloEl.textContent = pcfg.titulo;
      section.appendChild(tituloEl);
    }

    if (pcfg.descricao) {
      const descEl = document.createElement("div");
      descEl.style.cssText = "width:100%;max-width:900px;font-size:15px;color:" + (isDark ? "rgba(255,255,255,.65)" : "#7A8F96") + ";text-align:left;line-height:1.65;";
      descEl.textContent = pcfg.descricao;
      section.appendChild(descEl);
    }

    if (pcfg.carrossel && pcfg.carrossel.length) {
      renderCarrossel(pcfg.carrossel, section);
    }

    // PDFs
    if (data.pdfs.length) {
      const frame = document.createElement("div");
      frame.className = "pdf-frame" + (isDark ? " pdf-frame-dark" : "");
      frame.style.cssText = "width:100%;max-width:900px";
      data.pdfs.forEach(url => {
        if (url) renderPdf(url, frame, isDark);
      });
      section.appendChild(frame);
    }

    // Videos
    data.videos.forEach(url => renderVideo(url, section));

    main.appendChild(section);
  }
}

init();
</script>
